name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS
        run: composer phpcs

      - name: PHPStan (level 8, no baseline)
        run: composer phpstan

      - name: PHPUnit
        run: composer test

      - name: CSS namespace (PHP surface)
        run: composer check:php-namespace

      - name: Error prefix belongs to the consumer
        run: composer check:error-prefix

      - name: No gettext in the engine
        run: composer check:no-i18n

  js:
    name: JS checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Jest
        run: npm test

      - name: CSS namespace (shipped surface)
        run: npm run check:css-namespace
