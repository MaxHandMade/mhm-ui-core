# Throwaway environment for `composer test:wp`. Nothing here is shared with a
# product stack; `docker compose down -v` removes every trace.

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # The WordPress core tree and the test library live on a named volume so
      # the svn checkout survives between `run --rm` invocations.
      WP_CORE_DIR: /wp/wordpress/
      WP_TESTS_DIR: /wp/wordpress-tests-lib
    volumes:
      - ../..:/pkg
      - wp:/wp

volumes:
  wp:
